name: AI Code Review & Quality Gate (Jules, Codex & Gemini)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  quality-and-ai-review:
    name: Static Analysis & AI Review Trigger (@jules, @codex, @gemini)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Run Ruff Linter & Pytest Suite
        run: |
          python -m ruff check ios_forensics_tui.py tests/
          python -m pytest -v

      - name: Comment AI Review Invocation on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "### 🔍 Conferência Automatizada de Código & Empacotamento Windows",
              "",
              "Os testes unitários (`pytest`) e a análise estática (`ruff`) passaram com sucesso.",
              "",
              "Solicitando revisão técnica detalhada dos agentes:",
              "- **Jules** (@jules / @google-labs-jules): Conferir compatibilidade multiplataforma Windows/Linux, chamadas `subprocess` e resiliência na coleta `IOSForensicCollector`.",
              "- **Codex** (@codex review): Auditar os scripts PowerShell (`fetch_drivers_and_tools.ps1`, `install_drivers.ps1`, `sign_artifacts.ps1`), instalador Inno Setup (`installer.iss`) e pipeline de assinatura Authenticode.",
              "- **Gemini** (@gemini-code-assist / `/gemini review`): Verificar integridade forense na extração de NVRAM, IORegistry, AFC/SQLite e EXIF.",
              "",
              "/gemini review",
              "@codex review",
              "@jules please review this PR"
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
