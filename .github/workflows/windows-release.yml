name: Windows Installer, Drivers, Signing & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_version:
        description: "Versão da Release (ex: 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-windows-installer:
    name: Build, Bundle Drivers, Sign & Package (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.release_version }}" -ne "") {
            $ver = "${{ github.event.inputs.release_version }}"
          } elseif ("${{ github.ref_name }}" -match "^v(\d+\.\d+\.\d+.*)") {
            $ver = $Matches[1]
          } else {
            $ver = "1.0.0"
          }
          $tag = "v$ver"
          Write-Output "VERSION=$ver" >> $env:GITHUB_OUTPUT
          Write-Output "TAG=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $ver (Tag: $tag)"

      - name: Set up Python 3.12 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install Python dependencies & PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff pyinstaller

      - name: Run Linter & Unit Tests
        shell: pwsh
        run: |
          ruff check ios_forensics_tui.py tests/
          pytest -v

      - name: Fetch libimobiledevice Win64 Binaries & Apple USB Driver Scripts
        shell: pwsh
        run: |
          .\packaging\windows\fetch_drivers_and_tools.ps1 -OutputDir "$PWD\build\bundle"

      - name: Build Standalone TUI Executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean .\packaging\windows\ios_forensics.spec
          if (-not (Test-Path ".\dist\ios_forensics.exe")) {
            throw "ios_forensics.exe was not generated by PyInstaller!"
          }
          .\dist\ios_forensics.exe --version
          .\dist\ios_forensics.exe --help

      - name: Sign Executable & Bundled Binaries (Authenticode SHA-256)
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          .\packaging\windows\sign_artifacts.ps1 `
            -TargetFiles @("$PWD\dist\ios_forensics.exe") `
            -CertOutputDir "$PWD\build\bundle\drivers"

      - name: Compile Windows Installer via Inno Setup (ISCC)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.VERSION }}" .\packaging\windows\installer.iss
          Get-ChildItem .\dist\installer

      - name: Sign Final Windows Setup Installer & Verify Authenticode
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $setupExe = Get-ChildItem -Path ".\dist\installer" -Filter "iOS_Forensics_Setup_*.exe" | Select-Object -First 1
          if (-not $setupExe) {
            throw "Installer EXE not found in dist\installer!"
          }
          .\packaging\windows\sign_artifacts.ps1 `
            -TargetFiles @($setupExe.FullName) `
            -CertOutputDir "$PWD\build\bundle\drivers"

          # Copy Public Certificate to dist/installer for standalone verification
          Copy-Item -Path "$PWD\build\bundle\drivers\RLuf_iOS_Forensics_CodeSign.cer" -Destination ".\dist\installer\" -Force

      - name: Create Portable ZIP Package & SHA256SUMS
        shell: pwsh
        run: |
          $portableDir = ".\build\portable_stage\iOS_Forensics_v${{ steps.version.outputs.VERSION }}_x64"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item -Path ".\dist\ios_forensics.exe" -Destination $portableDir -Force
          Copy-Item -Path ".\ios_forensics_tui.py" -Destination $portableDir -Force
          Copy-Item -Path ".\README.md" -Destination $portableDir -Force
          Copy-Item -Path ".\LICENSE" -Destination $portableDir -Force
          Copy-Item -Path ".\build\bundle\bin" -Destination "$portableDir\bin" -Recurse -Force
          Copy-Item -Path ".\build\bundle\drivers" -Destination "$portableDir\drivers" -Recurse -Force

          $zipOut = ".\dist\installer\iOS_Forensics_Portable_v${{ steps.version.outputs.VERSION }}_x64.zip"
          Compress-Archive -Path "$portableDir\*" -DestinationPath $zipOut -Force

          Push-Location .\dist\installer
          $hashes = Get-ChildItem -File | ForEach-Object {
            $h = Get-FileHash -Path $_.Name -Algorithm SHA256
            "$($h.Hash.ToLower())  $($_.Name)"
          }
          $hashes | Set-Content -Path "SHA256SUMS.txt" -Encoding UTF8
          Get-Content "SHA256SUMS.txt"
          Pop-Location

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Forensics-Windows-x64-v${{ steps.version.outputs.VERSION }}
          path: |
            dist/installer/*.exe
            dist/installer/*.zip
            dist/installer/*.cer
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release (Windows Installer, Drivers & Signatures)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "iOS Forensics TUI Suite ${{ steps.version.outputs.TAG }} (Windows x64 Installer + Drivers)"
          generate_release_notes: true
          body: |
            ## 📱 iOS Forensics & USB Debug TUI Suite (${{ steps.version.outputs.TAG }}) — Windows x64 Release

            Pacote completo da suíte interativa TUI (`ios_forensics`) empacotado para **Windows 10/11 (x64)** com binários `libimobiledevice`, multiplexador `usbmuxd`, scripts de instalação de drivers USB Apple (`VID_05AC`) e assinatura digital **Authenticode SHA-256**.

            ### 📦 Arquivos da Release
            - **`iOS_Forensics_Setup_v${{ steps.version.outputs.VERSION }}_x64.exe`**: Instalador completo (Inno Setup) com configuração automática de drivers USB (`pnputil`), serviço `usbmuxd` / `Apple Mobile Device Service` e atalhos no Menu Iniciar.
            - **`iOS_Forensics_Portable_v${{ steps.version.outputs.VERSION }}_x64.zip`**: Versão portátil pronta para execução (`ios_forensics.exe` + `bin/` + `drivers/`).
            - **`RLuf_iOS_Forensics_CodeSign.cer`**: Certificado público de assinatura de código Authenticode SHA-256.
            - **`SHA256SUMS.txt`**: Hashes SHA-256 para auditoria e cadeia de custódia forense.

            ### 🤖 Revisão e Auditoria de Código (AI Code Review)
            Solicitamos a conferência técnica de arquitetura, segurança e empacotamento por:
            - **Jules**: @jules / @google-labs-jules
            - **Codex**: @codex
            - **Gemini**: @gemini / @gemini-code-assist
          files: |
            dist/installer/*.exe
            dist/installer/*.zip
            dist/installer/*.cer
            dist/installer/SHA256SUMS.txt
